name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Smoke test built binary
        run: |
          set -eu
          node dist/bin/sablectl.js --version
          node dist/bin/sablectl.js --help

  secrets:
    name: secrets (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The official action infers a base and head from the event, which has
      # no meaning for the first push to a repository (the "before" commit is
      # all zeroes) and makes it fail for a reason unrelated to secrets. The
      # pinned container scans the whole history directly, which is both the
      # behaviour wanted here and the same on every event type.
      - name: Scan full history for verified secrets
        run: |
          set -eu
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/trufflesecurity/trufflehog:3.90.8 \
            git file:///repo --results=verified --fail --no-update
